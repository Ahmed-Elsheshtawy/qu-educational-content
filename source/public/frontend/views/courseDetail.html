<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details - Masdar</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/courseDetail.css">

    <!-- Google AdSense (publisher ca-pub-2726830784121532) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2726830784121532" crossorigin="anonymous"></script>
    <script src="../scripts/adsScript.js" defer></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-bg"></div>
        <div class="container">
            <div class="header-content">
                <a href="/" class="brand">
                    <img src="/FinalLogo.png" alt="Masdar – Qatar University" class="brand-logo">
                </a>
                <nav class="nav" id="main-nav">
                    <a href="/" class="nav-link" id="nav-home">Home</a>
                    <a href="/about" class="nav-link" id="nav-about">About</a>
                    <a href="/submit" class="nav-link">Submit Resource</a>
                    <a href="/course-submit" class="nav-link">Request Course</a>
                    <a href="https://ko-fi.com/masdar" target="_blank" rel="noopener noreferrer" class="nav-support">
                        <svg class="kofi-icon-nav" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11.351 2.715c-2.7 0-4.986.025-6.83.26C2.078 3.285 0 5.154 0 8.61c0 3.506.182 6.13 1.585 8.493 1.584 2.701 4.233 4.182 7.662 4.182h.83c4.209 0 6.494-2.234 7.637-4a9.5 9.5 0 0 0 1.091-2.338C21.792 14.688 24 12.22 24 9.208v-.415c0-3.247-2.13-5.507-5.792-5.87-1.558-.156-2.65-.208-6.857-.208m0 1.947c4.208 0 5.09.052 6.571.182 2.624.311 4.13 1.584 4.13 4v.39c0 2.156-1.792 3.844-3.87 3.844h-.935l-.156.649c-.208 1.013-.597 1.818-1.039 2.546-.909 1.428-2.545 3.064-5.922 3.064h-.805c-2.571 0-4.831-.883-6.078-3.195-1.09-2-1.298-4.155-1.298-7.506 0-2.181.857-3.402 3.012-3.714 1.533-.233 3.559-.26 6.39-.26m6.547 2.287c-.416 0-.65.234-.65.546v2.935c0 .311.234.545.65.545 1.324 0 2.051-.754 2.051-2s-.727-2.026-2.052-2.026m-10.39.182c-1.818 0-3.013 1.48-3.013 3.142 0 1.533.858 2.857 1.949 3.897.727.701 1.87 1.429 2.649 1.896a1.47 1.47 0 0 0 1.507 0c.78-.467 1.922-1.195 2.623-1.896 1.117-1.039 1.974-2.364 1.974-3.897 0-1.662-1.247-3.142-3.039-3.142-1.065 0-1.792.545-2.338 1.298-.493-.753-1.246-1.298-2.312-1.298"/>
                        </svg>
                        Support
                    </a>
                    <a href="/admin" class="nav-link">Admin</a>
                </nav>
                <button class="nav-burger" id="nav-burger" aria-label="Open navigation menu" aria-expanded="false">
                    <span class="burger-line"></span>
                    <span class="burger-line"></span>
                    <span class="burger-line"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Course Header Section -->
    <section class="course-header-section">
        <div class="container">
            <div class="breadcrumb">
                <a href="../index.html">Home</a>
                <span class="separator">/</span>
                <span id="course-code" class="current">Loading...</span>
            </div>
            
            <div class="course-header-content">
                <div class="course-title-section">
                    <h1 id="course-name" class="page-title">Loading Course...</h1>
                    <div class="course-meta-badges">
                        <span class="meta-badge" id="resource-count">- Resources</span>
                    </div>
                    <button id="add-resource-btn" class="btn-add-resource">
                        <span>+</span> Add Resource for this Course
                    </button>
                </div>
                
                <div class="course-info-grid">
                    <div class="info-item">
                        <span class="info-label">College</span>
                        <span id="course-college" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Department</span>
                        <span id="course-department" class="info-value">-</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Ad: below the course header, above the resource list -->
    <div class="container">
        <div class="ad-slot">
            <span class="ad-slot__label">Advertisement</span>
            <!-- Masdar / Course – Top. Replace data-ad-client and data-ad-slot with your values. -->
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-2726830784121532"
                 data-ad-slot="3333333333"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>
    </div>

    <!-- Resources Section -->
    <section class="resources-main-section">
        <div class="container">
            <div class="resources-header">
                <h2 class="resources-title">Resources</h2>
                <div class="resources-filters">
                    <select id="type-filter" class="resource-filter">
                        <option value="">All Types</option>
                    </select>
                    <select id="year-filter" class="resource-filter">
                        <option value="">All Years</option>
                    </select>
                </div>
            </div>
            <div id="resources-container">
                <!-- Resources will be dynamically inserted here -->
                <div class="loading-state">
                    <p>Loading resources...</p>
                </div>
            </div>

            <!-- Ad: end of the resource list -->
            <div class="ad-slot ad-slot--boxed">
                <span class="ad-slot__label">Advertisement</span>
                <!-- Masdar / Course – Bottom. Replace data-ad-client and data-ad-slot with your values. -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-2726830784121532"
                     data-ad-slot="4444444444"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </div>
    </section>

    <!-- Resource Item Template -->
    <template id="resource-item-template">
        <div class="resource-item">
            <div class="resource-info">
                <div class="resource-header">
                    <h4 class="resource-title"></h4>
                    <span class="resource-type-badge"></span>
                </div>
                <p class="resource-description"></p>
                <div class="resource-meta">
                    <span class="resource-year"></span>
                    <span class="resource-filesize"></span>
                    <span class="resource-downloads"></span>
                </div>
                <div class="resource-tags">
                    <!-- Tags will be inserted here -->
                </div>
            </div>
            <div class="resource-actions">
                <a href="#" class="download-button" download>
                    Download
                </a>
            </div>
        </div>
    </template>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">&copy; 2026 Masdar. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="../scripts/courseDetailScript.js"></script>
</body>
</html>
